[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veille"
version = "0.1.0"
description = "Agregateur de veille IA + cybersecurite (V0 : ingestion RSS + affichage)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "nh3>=0.2.19",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veille"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "DTZ"]

[tool.ruff.lint.isort]
# conftest est importe par chemin depuis tests/ : il appartient au projet, pas
# aux dependances tierces.
known-first-party = ["veille", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: necessite un vrai Postgres (service `db` de docker compose)",
]
