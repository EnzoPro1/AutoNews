services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veille}
      POSTGRES_DB: ${POSTGRES_DB:-veille}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Piege B : pg_dump ecrit DANS le conteneur, le fichier apparait sur
      # l'hote par ce montage. Le dump ne transite jamais par un pipe
      # PowerShell, qui le corromprait silencieusement (pseudo-TTY, UTF-16).
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veille} -d ${POSTGRES_DB:-veille}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Bind-mounts de dev : le venv est editable, le code recharge sans rebuild.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./feeds.yaml:/app/feeds.yaml
      - ./alembic.ini:/app/alembic.ini
      - ./backups:/backups
      - ./state:/app/state

volumes:
  pgdata:
